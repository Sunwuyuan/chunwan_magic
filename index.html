<!DOCTYPE html>
<html lang="zh-CN">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>魔术计算器 - Magic Calculator</title>
</head>

<body>
  <div id="app"></div>
  <script type="module" src="/src/main.js"></script>
  <script>(() => { if (window.busuanziRequestSent) return; window.busuanziRequestSent = true; const u = new URL('https://cdn.busuanzi.cc/'); fetch(u.protocol + '//' + u.host + '/api.php', { method: 'POST', body: JSON.stringify({ url: location.href, referrer: document.referrer }) }).then(r => r.json()).then(r => { for (const k in r) document.querySelectorAll('#' + k).forEach(e => e.innerText = r[k]) }).catch(e => console.error(e)) })()</script>
</body>

</html>
